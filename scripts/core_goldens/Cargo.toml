[package]
name = "core-goldens"
version = "0.0.0"
edition = "2021"
publish = false
description = "Writes tests/fixtures/core_goldens.json, the core results several binding tests compare with"

# Its lock records the resolved Git or registry source. The generator verifies
# the full Git commit or checksum-bound published VCS commit before writing it.
[dependencies]
flate2 = "1"
sha2 = "0.10"
sidereon = { version = "3.0.0", git = "https://github.com/neilberkman/sidereon", rev = "e2fb3dfdc392d23087ed8aa1ee028a0056b4021b" }
sidereon-core = { version = "3.0.0", git = "https://github.com/neilberkman/sidereon", rev = "e2fb3dfdc392d23087ed8aa1ee028a0056b4021b" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
